security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        api_public:
            pattern: ^/(api/health|api/v2/health|api/v2/auth/dev-login|api/v2/auth/config|api/auth/config|api/v2/auth/google)
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            jwt: ~
            logout:
                path: api_auth_logout

    access_control:
        - { path: ^/api/(health|v2/health|v2/auth/dev-login|v2/auth/config|auth/config), roles: PUBLIC_ACCESS }
        - { path: ^/api/(auth/me|v2/auth/me), roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
