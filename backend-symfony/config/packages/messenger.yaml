framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 30000
                    multiplier: 2
                    max_delay: 0
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            'App\Message\ProcessJobUrlMessage': async
            'App\Message\ScoreVacancyMessage': async
