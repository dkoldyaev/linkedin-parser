<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; width: 250px; padding: 10px; margin: 0; }
    h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #333; }
    button { width: 100%; padding: 12px; margin-bottom: 10px; background: #0a66c2; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #004182; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { font-size: 13px; color: #555; text-align: center; min-height: 20px; }
    .success { color: #0f8b4d !important; }
    .error { color: #d11124 !important; }
  </style>
</head>
<body>
  <h3>Add to Job Tracker</h3>
  <button id="add-btn">Add This Vacancy</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
