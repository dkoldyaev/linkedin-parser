services:
  frontend:
    container_name: ${APP_NAME_PREFIX:?Set APP_NAME_PREFIX}-linkedin-parser-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: ${FRONTEND_TARGET:-runner}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      app:
        condition: service_healthy

  app:
    container_name: ${APP_NAME_PREFIX:?Set APP_NAME_PREFIX}-linkedin-parser-app
    build:
      context: .
      dockerfile: backend-symfony/Dockerfile
      target: ${BACKEND_TARGET:-runner}
      args:
        - APP_URL=${APP_URL}
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - APP_ENV=prod
      - APP_SECRET=${JWT_SECRET}
      - SERVER_NAME=:8000
      - APP_URL=${APP_URL}
      - DEFAULT_URI=${APP_URL}
      - DATA_DIR=/app/data
      - DATABASE_URL=${DATABASE_URL}
      - BROKER_URL=${BROKER_URL}
      - MESSENGER_TRANSPORT_DSN=${MESSENGER_TRANSPORT_DSN}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_MODEL=${MISTRAL_MODEL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - MERCURE_URL=${MERCURE_URL}
      - MERCURE_PUBLIC_URL=${MERCURE_PUBLIC_URL}
      - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET:?Set a random MERCURE_JWT_SECRET}
      - MERCURE_JWT_ISSUER=${MERCURE_JWT_ISSUER}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET}
      - DEV_AUTH=${DEV_AUTH}
      - CREATE_MOCK_DATA=${CREATE_MOCK_DATA}
      - EXTENSION_ID=${EXTENSION_ID}
      - PARSER_API_URL=${PARSER_API_URL}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      - mercure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v2/health | grep -q 'ok'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s

  mercure:
    container_name: ${APP_NAME_PREFIX:?Set APP_NAME_PREFIX}-linkedin-parser-mercure
    image: dunglas/mercure:v0.16
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set a random MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set a random MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${APP_URL}

  parser-api:
    container_name: ${APP_NAME_PREFIX:?Set APP_NAME_PREFIX}-linkedin-parser-parser-api
    build:
      context: .
      dockerfile: services/parser-api/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
