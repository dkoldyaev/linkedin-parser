services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_URL=${APP_URL}
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - APP_URL=${APP_URL}
      - DATA_DIR=/app/data
      - SQL_DIAGNOSTICS=${SQL_DIAGNOSTICS:-false}
      - DATABASE_URL=${DATABASE_URL:-}
      - BROKER_URL=${BROKER_URL}
      - STATIC_DIR=/app/static
      - LLM_PROVIDER=${LLM_PROVIDER:-mistral}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - MERCURE_URL=${MERCURE_URL:-http://mercure/.well-known/mercure}
      - MERCURE_PUBLIC_URL=${MERCURE_PUBLIC_URL:-http://localhost:3000/.well-known/mercure}
      - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - JWT_SECRET=${JWT_SECRET:-!ChangeThisAppJWTSecretKeyForUserSessions!}
      - DEV_AUTH=${DEV_AUTH:-false}
      - CREATE_MOCK_DATA=${CREATE_MOCK_DATA:-false}
      - EXTENSION_ID=${EXTENSION_ID:-}
      - PARSER_API_URL=${PARSER_API_URL:-http://parser-api:4000}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    depends_on:
      - mercure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ | grep -q '<div id=\"root\"></div>'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s

  mercure:
    image: dunglas/mercure:v0.16
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
        anonymous

  parser-api:
    build:
      context: .
      dockerfile: services/parser-api/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
